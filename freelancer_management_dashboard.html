                        .filter(t => t.type === "Deposit" && t.cashboxId === box.id)
                        .reduce((sum, t) => sum + t.amount, 0);

                    const withdrawals = transactions
                        .filter(t => t.type === "Withdraw" && t.cashboxId === box.id)
                        .reduce((sum, t) => sum + t.amount, 0);

                    const transfersIn = transactions
                        .filter(t => t.type === "Transfer" && t.toCashboxId === box.id)
                        .reduce((sum, t) => sum + t.amount, 0);

                    const transfersOut = transactions
                        .filter(t => t.type === "Transfer" && t.cashboxId === box.id)
                        .reduce((sum, t) => sum + t.amount, 0);

                    const currentBalance = box.baseBalance + deposits + transfersIn - withdrawals - transfersOut;
                    return { ...box, currentBalance };
                });
            }, [cashboxes, transactions]);

            const computedProjects = useMemo(() => {
                return projects.map(proj => {
                    const totalDeposits = transactions
                        .filter(t => t.projectId === proj.id && t.type === "Deposit")
                        .reduce((sum, t) => sum + t.amount, 0);
                    
                    const remaining = proj.cost - totalDeposits;
                    return {
                        ...proj,
                        paid: totalDeposits,
                        remaining: remaining >= 0 ? remaining : 0
                    };
                });
            }, [projects, transactions]);

            const kpis = useMemo(() => {
                const totalCollected = transactions
                    .filter(t => t.type === "Deposit")
                    .reduce((sum, t) => sum + t.amount, 0);

                const totalWithdrawn = transactions
                    .filter(t => t.type === "Withdraw")
                    .reduce((sum, t) => sum + t.amount, 0);

                const netTotal = totalCollected - totalWithdrawn;

                const totalProjectsCost = computedProjects.reduce((sum, p) => sum + p.cost, 0);
                const totalPaidProjects = computedProjects.reduce((sum, p) => sum + p.paid, 0);
                const totalOutstanding = totalProjectsCost - totalPaidProjects;

                const totalCount = computedProjects.length;
                const completed = computedProjects.filter(p => p.status === "Completed").length;
                const active = computedProjects.filter(p => p.status === "In Progress").length;
                const delayedOrCancelled = computedProjects.filter(p => p.status === "Delayed" || p.status === "Cancelled").length;

                const clientVolumeMap = {};
                computedProjects.forEach(p => {
                    clientVolumeMap[p.clientId] = (clientVolumeMap[p.clientId] || 0) + p.cost;
                });
                let topClientId = null;
                let maxVolume = 0;
                Object.keys(clientVolumeMap).forEach(cid => {
                    if (clientVolumeMap[cid] > maxVolume) {
                        maxVolume = clientVolumeMap[cid];
                        topClientId = parseInt(cid);
                    }
                });
                const topClientObj = clients.find(c => c.id === topClientId);
                const topClientName = topClientObj ? topClientObj.name : "N/A";

                return {
                    totalCollected,
                    totalWithdrawn,
                    netTotal,
                    totalOutstanding,
                    totalCount,
                    completed,
                    active,
                    delayedOrCancelled,
                    topClientName
                };
            }, [transactions, computedProjects, clients]);

            const filteredClients = useMemo(() => {

                    return matchText.includes(clientSearch.toLowerCase());

            }, [clients, clientSearch]);

            const filteredProjects = useMemo(() => {
                return computedProjects.filter(p => {
                    const clientObj = clients.find(c => c.id === p.clientId);
                    const clientName = clientObj ? clientObj.name : "";
                    const searchString = (p.name + " " + p.category + " " + clientName + " " + p.details).toLowerCase();
                    
                    const matchSearch = searchString.includes(projectFilters.search.toLowerCase());
                    const matchClient = projectFilters.client === "all" || p.clientId === parseInt(projectFilters.client);

                    const matchMin = !projectFilters.minCost || p.cost >= parseFloat(projectFilters.minCost);

                const padding = 35;

                const chartHeight = height - padding * 2;

                const maxVal = Math.max(...monthsData.map(d => d.val)) * 1.1;

                const points = monthsData.map((d, i) => {
                    const x = padding + (i / (monthsData.length - 1)) * chartWidth;
                    const y = height - padding - (d.val / maxVal) * chartHeight;
                    return { x, y, label: d.label, val: d.val };

                const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
                const fillD = `${pathD} L ${points[points.length - 1].x} ${height - padding} L ${points[0].x} ${height - padding} Z`;

                return (

                                    <stop offset="100%" stopColor="var(--primary)" stopOpacity="0.0" />
                                </linearGradient>
                            </defs>
                            
                            {[0, 0.25, 0.5, 0.75, 1].map((ratio, index) => {
                                const y = padding + chartHeight * ratio;
                                const labelVal = Math.round(maxVal * (1 - ratio));
                                return (
                                    <g key={index} className="opacity-40">
                                        <line x1={padding} y1={y} x2={width - padding} y2={y} stroke="var(--border-color)" strokeDasharray="4 4" />
                                        <text x={lang === "ar" ? width - 5 : 5} y={y + 4} fontSize="9" className="fill-slate-400 dark:fill-slate-500 font-sans" textAnchor={lang === "ar" ? "end" : "start"}>
                                            {labelVal.toLocaleString()} {t("egp")}
                                        </text>
                                    </g>
                                );
                            })}

                            <path d={fillD} fill="url(#chartGrad)" />
                            <path d={pathD} fill="none" stroke="var(--primary)" strokeWidth="3" strokeLinecap="round" />

                            {points.map((p, index) => (
                                <g key={index} className="group cursor-pointer">
                                    <circle cx={p.x} cy={p.y} r="5" fill="var(--bg-card)" stroke="var(--primary)" strokeWidth="3" />
                                    <circle cx={p.x} cy={p.y} r="9" fill="var(--primary)" className="opacity-0 group-hover:opacity-20 transition-opacity" />
                                    <text x={p.x} y={height - 8} fontSize="10" fontWeight="600" className="fill-slate-500 dark:fill-slate-400 font-sans" textAnchor="middle">

                                    <g className="opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none">
                                        <rect x={p.x - 55} y={p.y - 35} width="110" height="24" rx="4" fill="#1e293b" />
                                        <text x={p.x} y={p.y - 19} fill="#ffffff" fontSize="10" fontWeight="600" textAnchor="middle" className="font-sans">
                                            {p.val.toLocaleString()} {t("egp")}
                                        </text>
                                    </g>
                                </g>
                            ))}
                        </svg>

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
