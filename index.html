<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>لوحة الإدارة المالية للمستقلين</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Cairo (Arabic) & Inter (English) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Animate.css for superb mobile micro-animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--primary)',
                        primaryHover: 'var(--primary-hover)',
                        primaryLight: 'var(--primary-light)',
                        bgMain: 'var(--bg-main)',
                        bgCard: 'var(--bg-card)',
                        textMain: 'var(--text-main)',
                        textMuted: 'var(--text-muted)',
                        borderColor: 'var(--border-color)',
                        bgHeader: 'var(--bg-header)',
                    },
                    fontFamily: {
                        sans: ['Cairo', 'Inter', 'sans-serif'],
                    },
                    animation: {
                        'bounce-slow': 'bounce 3s infinite',
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
                        'fade-in': 'fadeIn 0.2s ease-out'
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(100%)' },
                            '100%': { transform: 'translateY(0)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --primary-light: #e0f2fe;
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --bg-header: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow-x: hidden;
        }

        /* Hide Scrollbar for clean mobile feel */
        ::-webkit-scrollbar {
            display: none;
        }

        /* Glassmorphism Navigation Bar Effect */
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        .dark .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Dynamic fluid cards with active tap feedback */
        .mobile-tap-card:active {
            transform: scale(0.97);
            transition: transform 0.1s ease-in-out;
        }

        /* Safe margins for devices with notches (iOS Safe Areas) */
        .pb-safe {
            padding-bottom: calc(4.5rem + env(safe-area-inset-bottom)); /* Extra padding for bottom nav */
        }
        .pt-safe {
            padding-top: calc(1rem + env(safe-area-inset-top));
        }
        
        /* Barcode simulated look */
        .simulated-barcode {
            background: repeating-linear-gradient(
                90deg,
                #0f172a,
                #0f172a 2px,
                transparent 2px,
                transparent 6px,
                #0f172a 6px,
                #0f172a 10px,
                transparent 10px,
                transparent 12px
            );
        }
        .dark .simulated-barcode {
            background: repeating-linear-gradient(
                90deg,
                #f8fafc,
                #f8fafc 2px,
                transparent 2px,
                transparent 6px,
                #f8fafc 6px,
                #f8fafc 10px,
                transparent 10px,
                transparent 12px
            );
        }
    </style>
</head>
<body class="h-full antialiased overflow-hidden select-none">
    <div id="root" class="h-full flex flex-col"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const translations = {
            ar: {
                appName: "الوكيل المستقل",
                subTitle: "لوحة التحكم المالية للمحمول",
                welcomeUser: "مرحباً، ",
                dashboard: "الرئيسية",
                clients: "العملاء",
                projects: "المشاريع",
                cashboxes: "الخزن",
                transactions: "حركات الفلوس",
                settings: "الإعدادات",
                
                // Dashboard & General
                totalCollected: "إجمالي المقبوضات",
                totalWithdrawn: "إجمالي المسحوبات",
                netTotal: "الصافي العام",
                outstandingBalances: "المستحقات المعلقة للعملاء",
                addPayment: "تسجيل دفعة",
                egp: "ج.م",
                saveSuccess: "تم الحفظ بنجاح!",
                deleteSuccess: "تم الحذف بنجاح!",
                
                // Actions
                search: "ابحث هنا...",
                filter: "تصفية",
                add: "إضافة جديد",
                edit: "تعديل",
                delete: "حذف",
                save: "حفظ",
                cancel: "إلغاء",
                all: "الكل",
            }
        };

        const themePresets = {
            oceanBlue: { primary: "#0284c7", hover: "#0369a1", light: "#e0f2fe" },
            forestGreen: { primary: "#10b981", hover: "#059669", light: "#d1fae5" },
            sunsetOrange: { primary: "#f97316", hover: "#ea580c", light: "#ffedd5" },
            royalIndigo: { primary: "#6366f1", hover: "#4f46e5", light: "#e0e7ff" },
            crimsonRose: { primary: "#f43f5e", hover: "#e11d48", light: "#ffe4e6" },
            midnightGold: { primary: "#eab308", hover: "#ca8a04", light: "#fef3c7" }
        };

        const initialClients = [
            { id: 101, name: "م. محمد الشريف - إعمار مصر", mobile1: "01002345678", mobile2: "01223456789", email: "elsharif@emaar.com", address: "شارع الـ 90، التجمع الخامس، القاهرة", createdAt: "2026-03-01" },
            { id: 102, name: "مؤسسة سمارت هوم للديكور", mobile1: "01144556677", mobile2: "", email: "info@smarthome.eg", address: "الدقي، خلف مجلس الدولة، الجيزة", createdAt: "2026-04-10" },
            { id: 103, name: "د. هدى محمود - عيادات رويال", mobile1: "01599887766", mobile2: "01009988776", email: "hoda@royal-clinics.com", address: "زيزينيا، شارع أبو قير، الإسكندرية", createdAt: "2026-05-15" }
        ];

        const initialProjects = [
            { id: 201, name: "تصميم موقع حجز العيادات بالكامل", category: "Web Apps", clientId: 103, status: "In Progress", cost: 180000, details: "بناء نظام متكامل لحجز مواعيد الأطباء لـ 4 عيادات تخصصية.", createdAt: "2026-05-18" },
            { id: 202, name: "حملة التسويق العقاري الرقمي", category: "Marketing", clientId: 101, status: "Completed", cost: 95000, details: "إدارة إعلانات فيسبوك وإنستجرام وتيك توك الترويجية.", createdAt: "2026-03-05" },
            { id: 203, name: "إعادة رسم وتطوير الهوية البصرية", category: "Branding", clientId: 102, status: "Delayed", cost: 40000, details: "تصميم الشعار ومطبوعات المكاتب والكتيب الإرشادي للعلامة.", createdAt: "2026-04-15" }
        ];

        const initialCashboxes = [
            { id: 1, paymentMethod: "حساب البنك التجاري CIB", baseBalance: 500000, createdAt: "2026-01-01" },
            { id: 2, paymentMethod: "إنستاباي Instapay", baseBalance: 40000, createdAt: "2026-01-01" },
            { id: 3, paymentMethod: "فودافون كاش", baseBalance: 15000, createdAt: "2026-01-01" },
            { id: 4, paymentMethod: "نقدية بالخزنة اليدوية", baseBalance: 5000, createdAt: "2026-01-01" }
        ];

        const initialTransactions = [
            { id: 1001, type: "Deposit", amount: 95000, notes: "المسدد بالكامل لحملة إعمار مصر العقارية", cashboxId: 1, clientId: 101, projectId: 202, toCashboxId: null, createdAt: "2026-03-05" },
            { id: 1002, type: "Deposit", amount: 60000, notes: "مقدم تعاقد موقع عيادات رويال", cashboxId: 2, clientId: 103, projectId: 201, toCashboxId: null, createdAt: "2026-05-18" },
            { id: 1003, type: "Withdraw", amount: 8000, notes: "تجديد اشتراك استضافة وسيرفر تجريبي للعملاء", cashboxId: 2, clientId: null, projectId: null, toCashboxId: null, createdAt: "2026-05-25" },
            { id: 1004, type: "Transfer", amount: 5000, notes: "تغذية خزينة النقدية اليدوية من محفظة فودافون كاش", cashboxId: 3, clientId: null, projectId: null, toCashboxId: 4, createdAt: "2026-06-01" }
        ];

        function App() {
            const [currentModule, setCurrentModule] = useState("dashboard");
            const [darkMode, setDarkMode] = useState(false);
            
            const [settings, setSettings] = useState({
                companyName: "الوكيل لتقنية المعلومات",
                userName: "بشمهندس محمد بيومي",
                themePreset: "oceanBlue",
                customColor: "#10b981"
            });

            const [clients, setClients] = useState(initialClients);
            const [projects, setProjects] = useState(initialProjects);
            const [cashboxes, setCashboxes] = useState(initialCashboxes);
            const [transactions, setTransactions] = useState(initialTransactions);

            const [globalSearch, setGlobalSearch] = useState("");
            const [notification, setNotification] = useState(null);

            // Modals & Bottom Sheets
            const [selectedLedgerBox, setSelectedLedgerBox] = useState(null);
            const [receiptTx, setReceiptTx] = useState(null);
            const [smartInputText, setSmartInputText] = useState("");
            const [smartParseResult, setSmartParseResult] = useState(null);
            const [quickActionMenu, setQuickActionMenu] = useState(false);
            
            // Outstanding Details Full Modal
            const [outstandingModalOpen, setOutstandingModalOpen] = useState(false);

            // Add/Edit Modals
            const [clientModal, setClientModal] = useState({ isOpen: false, data: null, isDetail: false });
            const [projectModal, setProjectModal] = useState({ isOpen: false, data: null });
            const [cashboxModal, setCashboxModal] = useState({ isOpen: false, data: null });
            const [transactionModal, setTransactionModal] = useState({ isOpen: false, data: null });
            
            // Confirm Dialog Modal State
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, type: "", idToDelete: null, displayName: "" });

            const showToast = (message) => {
                setNotification(message);
                setTimeout(() => setNotification(null), 3000);
            };

            const t = (key) => translations["ar"][key] || key;

            const currentColors = useMemo(() => {
                if (settings.themePreset === "customTheme") {
                    return { primary: settings.customColor, hover: settings.customColor, light: settings.customColor + "22" };
                }
                return themePresets[settings.themePreset] || themePresets.oceanBlue;
            }, [settings.themePreset, settings.customColor]);

            useEffect(() => {
                const root = document.documentElement;
                root.style.setProperty('--primary', currentColors.primary);
                root.style.setProperty('--primary-hover', currentColors.hover);
                root.style.setProperty('--primary-light', currentColors.light);

                if (darkMode) {
                    root.classList.add('dark');
                    root.style.setProperty('--bg-main', '#0f172a');
                    root.style.setProperty('--bg-card', '#1e293b');
                    root.style.setProperty('--bg-header', '#1e293b');
                    root.style.setProperty('--text-main', '#f8fafc');
                    root.style.setProperty('--text-muted', '#94a3b8');
                    root.style.setProperty('--border-color', '#334155');
                } else {
                    root.classList.remove('dark');
                    root.style.setProperty('--bg-main', '#f1f5f9');
                    root.style.setProperty('--bg-card', '#ffffff');
                    root.style.setProperty('--bg-header', '#ffffff');
                    root.style.setProperty('--text-main', '#0f172a');
                    root.style.setProperty('--text-muted', '#64748b');
                    root.style.setProperty('--border-color', '#e2e8f0');
                }
            }, [darkMode, currentColors]);

            const computedProjects = useMemo(() => {
                return projects.map(proj => {
                    const projectDeposits = transactions
                        .filter(t => t.projectId === proj.id && t.type === "Deposit")
                        .reduce((sum, t) => sum + t.amount, 0);
                    return {
                        ...proj,
                        paid: projectDeposits,
                        remaining: Math.max(0, proj.cost - projectDeposits)
                    };
                });
            }, [projects, transactions]);

            const computedCashboxes = useMemo(() => {
                return cashboxes.map(box => {
                    const deposits = transactions.filter(t => t.type === "Deposit" && t.cashboxId === box.id).reduce((sum, t) => sum + t.amount, 0);
                    const withdrawals = transactions.filter(t => t.type === "Withdraw" && t.cashboxId === box.id).reduce((sum, t) => sum + t.amount, 0);
                    const transfersIn = transactions.filter(t => t.type === "Transfer" && t.toCashboxId === box.id).reduce((sum, t) => sum + t.amount, 0);
                    const transfersOut = transactions.filter(t => t.type === "Transfer" && t.cashboxId === box.id).reduce((sum, t) => sum + t.amount, 0);
                    return { ...box, currentBalance: box.baseBalance + deposits + transfersIn - withdrawals - transfersOut };
                });
            }, [cashboxes, transactions]);

            const financials = useMemo(() => {
                const totalCollected = transactions.filter(t => t.type === "Deposit").reduce((sum, t) => sum + t.amount, 0);
                const totalWithdrawn = transactions.filter(t => t.type === "Withdraw").reduce((sum, t) => sum + t.amount, 0);
                const outstanding = computedProjects.reduce((sum, p) => sum + p.remaining, 0);
                return { totalCollected, totalWithdrawn, net: totalCollected - totalWithdrawn, outstanding };
            }, [transactions, computedProjects]);

            const handleSmartInputParse = (text) => {
                setSmartInputText(text);
                if (!text.trim()) { setSmartParseResult(null); return; }
                let amount = null, type = "Deposit", detectedBoxId = null;
                const amountMatch = text.match(/\d+/);
                if (amountMatch) amount = parseFloat(amountMatch[0]);
                if (text.includes("سحب") || text.includes("صرف") || text.includes("شحن") || text.includes("دفع")) type = "Withdraw";
                else if (text.includes("تحويل") || text.includes("نقل") || text.includes("حرك")) type = "Transfer";
                
                for (const box of cashboxes) {
                    const normalizedMethod = box.paymentMethod.toLowerCase();
                    const words = normalizedMethod.split(" ");
                    if (words.some(w => w.length > 2 && text.toLowerCase().includes(w))) {
                        detectedBoxId = box.id; break;
                    }
                }
                setSmartParseResult({ type, amount, cashboxId: detectedBoxId, notes: text });
            };

            const triggerDeleteConfirmation = (type, id, name) => {
                setConfirmModal({ isOpen: true, type, idToDelete: id, displayName: name });
            };

            const executeDelete = () => {
                const { type, idToDelete } = confirmModal;
                if (type === "client") setClients(clients.filter(c => c.id !== idToDelete));
                else if (type === "project") setProjects(projects.filter(p => p.id !== idToDelete));
                else if (type === "transaction") setTransactions(transactions.filter(t => t.id !== idToDelete));
                setConfirmModal({ isOpen: false, type: "", idToDelete: null, displayName: "" });
                showToast(t("deleteSuccess"));
            };

            return (
                <div className="h-full flex flex-col justify-between overflow-hidden bg-bgMain text-textMain relative pb-safe">
                    
                    {/* Header bar */}
                    <header className="glass-nav border-b border-borderColor pt-safe px-5 pb-3 flex items-center justify-between sticky top-0 z-40 shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full flex items-center justify-center font-extrabold text-white text-base shadow-md bg-primary">
                                <i className="fa-solid fa-feather-pointed"></i>
                            </div>
                            <div>
                                <h1 className="text-sm font-bold tracking-tight text-textMain">{settings.companyName}</h1>
                                <p className="text-[10px] text-textMuted font-medium">
                                    {t("welcomeUser")}<span className="text-primary font-bold">{settings.userName}</span>
                                </p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            <button onClick={() => setDarkMode(!darkMode)} className="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 text-amber-500 dark:text-amber-400 flex items-center justify-center shadow-sm active:scale-90 transition-all">
                                <i className={`fa-solid ${darkMode ? "fa-sun" : "fa-moon"} text-sm`}></i>
                            </button>
                            <button onClick={() => setCurrentModule("settings")} className={`w-9 h-9 rounded-full shadow-sm flex items-center justify-center transition-all active:scale-90 ${currentModule === "settings" ? "bg-primary text-white" : "bg-slate-100 dark:bg-slate-800 text-textMuted"}`}>
                                <i className="fa-solid fa-gear text-sm"></i>
                            </button>
                        </div>
                    </header>

                    {/* Toast Notification Box */}
                    {notification && (
                        <div className="fixed top-24 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-2.5 rounded-full text-xs font-bold shadow-xl flex items-center gap-2 border border-slate-800 dark:border-slate-100 animate__animated animate__fadeInDown animate__faster">
                            <i className="fa-solid fa-circle-check text-emerald-500 text-sm"></i>
                            <span>{notification}</span>
                        </div>
                    )}

                    {}
                    <div className="flex-1 overflow-y-auto px-4 py-3 space-y-4">
                        
                        {/* 1. Dashboard Module */}
                        {currentModule === "dashboard" && (
                            <div className="space-y-4 animate__animated animate__fadeIn animate__faster">
                                
                                {/* High-Fidelity Mobile Grid Metrics */}
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="bg-bgCard p-3.5 rounded-2xl border-r-4 border-emerald-500 shadow-sm border border-borderColor mobile-tap-card">
                                        <p className="text-[10px] text-textMuted font-bold">{t("totalCollected")}</p>
                                        <h3 className="text-lg font-black text-emerald-600 dark:text-emerald-400 mt-1 font-sans">
                                            {financials.totalCollected.toLocaleString()} <span className="text-[10px] font-normal">{t("egp")}</span>
                                        </h3>
                                    </div>
                                    <div className="bg-bgCard p-3.5 rounded-2xl border-r-4 border-rose-500 shadow-sm border border-borderColor mobile-tap-card">
                                        <p className="text-[10px] text-textMuted font-bold">{t("totalWithdrawn")}</p>
                                        <h3 className="text-lg font-black text-rose-600 dark:text-rose-400 mt-1 font-sans">
                                            {financials.totalWithdrawn.toLocaleString()} <span className="text-[10px] font-normal">{t("egp")}</span>
                                        </h3>
                                    </div>
                                    <div className="bg-bgCard p-4 rounded-2xl border-r-4 border-primary shadow-sm border border-borderColor col-span-2 mobile-tap-card flex justify-between items-center">
                                        <div>
                                            <p className="text-[10px] text-textMuted font-bold">{t("netTotal")}</p>
                                            <h3 className="text-2xl font-black text-primary mt-1 font-sans">
                                                {financials.net.toLocaleString()} <span className="text-xs font-normal">{t("egp")}</span>
                                            </h3>
                                        </div>
                                        <div className="w-10 h-10 bg-primaryLight rounded-full flex items-center justify-center text-primary">
                                            <i className="fa-solid fa-wallet text-sm"></i>
                                        </div>
                                    </div>
                                </div>

                                {/* Outstanding Balances Tracker - EMPHASIZED */}
                                <div className="bg-rose-50 dark:bg-rose-950/20 p-4 rounded-2xl border-2 border-rose-200 dark:border-rose-900/50 shadow-sm space-y-3 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-24 h-24 bg-rose-500/10 rounded-full blur-2xl"></div>
                                    <div className="flex flex-col gap-2 border-b border-rose-200 dark:border-rose-900/50 pb-3">
                                        <div className="flex justify-between items-center">
                                            <h4 className="text-sm font-black text-rose-800 dark:text-rose-300 flex items-center gap-2">
                                                <i className="fa-solid fa-triangle-exclamation text-rose-500 animate-pulse"></i>
                                                <span>{t("outstandingBalances")}</span>
                                            </h4>
                                            <span className="text-sm font-black text-rose-600 dark:text-rose-400 font-sans bg-white dark:bg-slate-900 px-3 py-1 rounded-xl shadow-sm">
                                                {financials.outstanding.toLocaleString()} {t("egp")}
                                            </span>
                                        </div>
                                        <p className="text-[10px] text-rose-700/80 dark:text-rose-400/80">إجمالي الديون المتبقية لدى العملاء والتي لم يتم تحصيلها بعد.</p>
                                    </div>

                                    {/* Preview of top 2 debts */}
                                    <div className="space-y-2">
                                        {computedProjects.filter(p => p.remaining > 0).slice(0, 2).map(proj => {
                                            const clientObj = clients.find(c => c.id === proj.clientId);
                                            return (
                                                <div key={proj.id} className="p-2.5 bg-white dark:bg-slate-900 rounded-xl text-xs flex justify-between items-center shadow-sm border border-rose-100 dark:border-rose-900/30">
                                                    <div>
                                                        <h5 className="font-bold text-textMain truncate max-w-[150px]">{proj.name}</h5>
                                                        <p className="text-[10px] text-textMuted mt-0.5">{clientObj?.name}</p>
                                                    </div>
                                                    <p className="font-extrabold text-rose-600 dark:text-rose-400 font-sans">{proj.remaining.toLocaleString()}</p>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <button 
                                        onClick={() => setOutstandingModalOpen(true)}
                                        className="w-full py-2.5 mt-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl shadow-md active:scale-95 transition-all flex items-center justify-center gap-2"
                                    >
                                        <i className="fa-solid fa-list-check"></i> عرض كل تفاصيل المستحقات
                                    </button>
                                </div>

                                {/* Smart NLP Quick Entry Widget */}
                                <div className="bg-bgCard p-4 rounded-2xl border border-borderColor shadow-sm space-y-3">
                                    <h4 className="text-xs font-bold text-textMain flex items-center gap-2">
                                        <i className="fa-solid fa-wand-magic-sparkles text-amber-500"></i>
                                        <span>إضافة حركة سريعة بالذكاء</span>
                                    </h4>
                                    <div className="flex gap-2">

                                <div className="text-center space-y-3">
                                    <div className="w-12 h-12 rounded-full bg-rose-100 dark:bg-rose-950/40 text-rose-600 flex items-center justify-center mx-auto text-xl"><i className="fa-solid fa-triangle-exclamation"></i></div>
                                    <h3 className="font-extrabold text-sm text-textMain">تأكيد الحذف</h3>
                                    <p className="text-xs text-textMuted leading-relaxed">هل أنت متأكد تماماً من رغبتك في حذف هذا العنصر؟ لا يمكن استرجاعه.</p>
                                    <p className="text-xs font-bold text-rose-600 font-sans mt-1 bg-rose-50 dark:bg-rose-950/20 py-1.5 px-3 rounded-xl inline-block">{confirmModal.displayName}</p>
                                </div>
                                <div className="flex gap-2.5 mt-5">
                                    <button onClick={executeDelete} className="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl transition-all">نعم، حذف</button>
                                    <button onClick={() => setConfirmModal({ isOpen: false, type: "", idToDelete: null, displayName: "" })} className="flex-1 py-2.5 bg-bgMain text-textMuted font-bold text-xs rounded-xl transition-all">إلغاء</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {selectedLedgerBox && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-end justify-center">
                            <div className="bg-bgCard w-full rounded-t-[2.5rem] border-t border-borderColor max-h-[90%] overflow-y-auto p-6 animate__animated animate__slideInUp animate__faster">
                                <div className="flex justify-between items-center border-b border-borderColor pb-3">
                                    <div><h3 className="font-extrabold text-sm text-textMain">كشف حساب ⇄</h3><p className="text-[10px] text-textMuted">{selectedLedgerBox.paymentMethod}</p></div>
                                    <button onClick={() => setSelectedLedgerBox(null)} className="text-textMuted text-lg">✕</button>
                                </div>
                                <div className="py-4 text-center">
                                    <span className="text-[10px] text-textMuted">الرصيد الحقيقي</span>
                                    <h4 className="text-2xl font-black text-primary font-sans">{computedCashboxes.find(b => b.id === selectedLedgerBox.id)?.currentBalance.toLocaleString()} ج.م</h4>
                                </div>
                                <div className="space-y-2">
                                    {transactions.filter(t => t.cashboxId === selectedLedgerBox.id || t.toCashboxId === selectedLedgerBox.id).map(tx => {
                                        const isDeposit = (tx.type === "Deposit" && tx.cashboxId === selectedLedgerBox.id) || (tx.type === "Transfer" && tx.toCashboxId === selectedLedgerBox.id);
                                        return (
                                            <div key={tx.id} className="p-3 bg-bgMain rounded-xl text-xs flex justify-between items-center border border-borderColor/50">
                                                <div>
                                                    <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${isDeposit ? "text-emerald-600 bg-emerald-50 dark:bg-emerald-950/20" : "text-rose-600 bg-rose-50 dark:bg-rose-950/20"}`}>
                                                        {tx.type === "Transfer" ? "تحويل" : isDeposit ? "إيداع" : "سحب"}
                                                    </span>
                                                    <p className="font-medium text-textMain mt-1">{tx.notes}</p>
                                                </div>
                                                <span className={`font-black font-sans ${isDeposit ? "text-emerald-600" : "text-rose-600"}`}>
                                                    {isDeposit ? "+" : "-"} {tx.amount.toLocaleString()}
                                                </span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {receiptTx && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[55] flex items-center justify-center p-4">
                            <div className="bg-bgCard w-full max-w-sm rounded-3xl border border-borderColor p-6 shadow-2xl animate__animated animate__zoomIn animate__faster text-center">
                                <div className="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto text-xl mb-3"><i className="fa-solid fa-receipt"></i></div>
                                <h3 className="font-black text-sm text-textMain">إيصال رقم #{receiptTx.id}</h3>
                                <div className="border-y border-dashed border-borderColor py-3 my-3 text-right space-y-2 text-xs">
                                    <div className="flex justify-between"><span className="text-textMuted">المبلغ:</span><span className="font-black text-emerald-600 font-sans">{receiptTx.amount.toLocaleString()} ج.م</span></div>
                                    <div className="flex justify-between"><span className="text-textMuted">البيان:</span><span className="font-bold">{receiptTx.notes}</span></div>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => showToast("تم النسخ للمشاركة!")} className="flex-1 py-2.5 bg-primary text-white font-bold text-xs rounded-xl">مشاركة</button>
                                    <button onClick={() => setReceiptTx(null)} className="px-4 py-2.5 bg-bgMain text-textMuted font-bold text-xs rounded-xl">إغلاق</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {clientModal.isOpen && !clientModal.isDetail && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-end justify-center">
                            <div className="bg-bgCard w-full rounded-t-[2.5rem] border-t border-borderColor p-6 animate__animated animate__slideInUp animate__faster">
                                <h3 className="font-extrabold text-sm mb-4">{clientModal.data ? "تعديل عميل" : "إضافة عميل"}</h3>
                                <form onSubmit={(e) => {
                                    e.preventDefault(); const fd = new FormData(e.target);
                                    const cData = { id: clientModal.data ? clientModal.data.id : Date.now(), name: fd.get("name"), mobile1: fd.get("mobile1"), email: fd.get("email") };
                                    if (clientModal.data) setClients(clients.map(c => c.id === cData.id ? {...c, ...cData} : c)); else setClients([cData, ...clients]);
                                    setClientModal({isOpen: false, data: null}); showToast("تم الحفظ!");
                                }} className="space-y-3 text-xs">
                                    <input type="text" name="name" placeholder="اسم العميل" defaultValue={clientModal.data?.name} className="w-full border border-borderColor bg-bgMain p-3 rounded-xl" required />
                                    <input type="text" name="mobile1" placeholder="الموبايل" defaultValue={clientModal.data?.mobile1} className="w-full border border-borderColor bg-bgMain p-3 rounded-xl" required />
                                    <div className="flex gap-2 pt-2">
                                        <button type="submit" className="flex-1 py-3 bg-primary text-white font-bold rounded-xl">حفظ</button>
                                        <button type="button" onClick={() => setClientModal({isOpen: false, data: null})} className="flex-1 py-3 bg-bgMain text-textMuted font-bold rounded-xl">إلغاء</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {transactionModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-end justify-center">
                            <div className="bg-bgCard w-full rounded-t-[2.5rem] border-t border-borderColor max-h-[90%] overflow-y-auto p-6 animate__animated animate__slideInUp animate__faster">
                                <h3 className="font-extrabold text-sm mb-4">إضافة حركة مالية</h3>
                                <form onSubmit={(e) => {
                                    e.preventDefault(); const fd = new FormData(e.target);
                                    const rawToCashbox = fd.get("toCashboxId");
                                    const newTx = {
                                        id: Date.now(), type: fd.get("type"), amount: parseFloat(fd.get("amount")),
                                        cashboxId: parseInt(fd.get("cashboxId")), notes: fd.get("notes"),
                                        clientId: fd.get("clientId") ? parseInt(fd.get("clientId")) : null,
                                        projectId: fd.get("projectId") ? parseInt(fd.get("projectId")) : null,
                                        toCashboxId: rawToCashbox ? parseInt(rawToCashbox) : null,
                                        createdAt: new Date().toISOString().split("T")[0]
                                    };
                                    setTransactions([newTx, ...transactions]); setTransactionModal({isOpen: false, data: null}); showToast("تم تسجيل الحركة!");
                                }} className="space-y-3 text-xs">
                                    <select name="type" defaultValue={transactionModal.data?.type || "Deposit"} className="w-full border border-borderColor bg-bgMain p-3 rounded-xl font-bold">
                                        <option value="Deposit">إيداع (+)</option><option value="Withdraw">سحب (-)</option><option value="Transfer">تحويل (⇄)</option>
                                    </select>
                                    <input type="number" name="amount" placeholder="المبلغ" defaultValue={transactionModal.data?.amount} className="w-full border border-borderColor bg-bgMain p-3 rounded-xl font-sans" required />
                                    <select name="cashboxId" defaultValue={transactionModal.data?.cashboxId} className="w-full border border-borderColor bg-bgMain p-3 rounded-xl" required>
                                        <option value="">من خزنة...</option>{cashboxes.map(b => <option key={b.id} value={b.id}>{b.paymentMethod}</option>)}
                                    </select>
                                    <select name="toCashboxId" className="w-full border border-borderColor bg-bgMain p-3 rounded-xl">
                                        <option value="">إلى خزنة (للتحويل فقط)...</option>{cashboxes.map(b => <option key={b.id} value={b.id}>{b.paymentMethod}</option>)}
                                    </select>
                                    <select name="projectId" defaultValue={transactionModal.data?.projectId} className="w-full border border-borderColor bg-bgMain p-3 rounded-xl">
                                        <option value="">ارتباط بمشروع (اختياري)...</option>{projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                    </select>
                                    <input type="text" name="notes" placeholder="البيان" defaultValue={transactionModal.data?.notes} className="w-full border border-borderColor bg-bgMain p-3 rounded-xl" required />
                                    <div className="flex gap-2 pt-2">
                                        <button type="submit" className="flex-1 py-3 bg-primary text-white font-bold rounded-xl">حفظ الحركة</button>
                                        <button type="button" onClick={() => setTransactionModal({isOpen: false, data: null})} className="flex-1 py-3 bg-bgMain text-textMuted font-bold rounded-xl">إلغاء</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
