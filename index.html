                    fontFamily: {
                        sans: ['Cairo', 'Inter', 'sans-serif'],

                    animation: {
                        'bounce-slow': 'bounce 3s infinite',

                        'fade-in': 'fadeIn 0.2s ease-out'

                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(100%)' },

            const showToast = (message) => {
                setNotification(message);
                setTimeout(() => setNotification(null), 3000);
            };

            const t = (key) => translations[lang][key] || key;

            const currentColors = useMemo(() => {
                if (settings.themePreset === "customTheme") {
                    return {
                        primary: settings.customColor,
                        hover: settings.customColor,
                        light: settings.customColor + "22"
                    };
                }
                return themePresets[settings.themePreset] || themePresets.oceanBlue;
            }, [settings.themePreset, settings.customColor]);

            // Syncing layout changes, theme colors, and Dark Mode dynamically
            useEffect(() => {
                const root = document.documentElement;
                root.style.setProperty('--primary', currentColors.primary);
                root.style.setProperty('--primary-hover', currentColors.hover);
                root.style.setProperty('--primary-light', currentColors.light);

                if (darkMode) {
                    root.classList.add('dark');
                    root.style.setProperty('--bg-main', '#0f172a');
                    root.style.setProperty('--bg-card', '#1e293b');
                    root.style.setProperty('--bg-header', '#1e293b');
                    root.style.setProperty('--text-main', '#f8fafc');
                    root.style.setProperty('--text-muted', '#94a3b8');
                    root.style.setProperty('--border-color', '#334155');
                } else {
                    root.classList.remove('dark');
                    root.style.setProperty('--bg-main', '#f1f5f9');
                    root.style.setProperty('--bg-card', '#ffffff');
                    root.style.setProperty('--bg-header', '#ffffff');
                    root.style.setProperty('--text-main', '#0f172a');
                    root.style.setProperty('--text-muted', '#64748b');
                    root.style.setProperty('--border-color', '#e2e8f0');
                }
            }, [darkMode, currentColors]);

            // Sync document language direction
            useEffect(() => {
                const htmlEl = document.documentElement;
                htmlEl.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
                htmlEl.setAttribute("lang", lang);
            }, [lang]);

            // Calculated Properties for Live Balances and Financial Metrics
            const computedProjects = useMemo(() => {
                return projects.map(proj => {
                    const projectDeposits = transactions
                        .filter(t => t.projectId === proj.id && t.type === "Deposit")
                        .reduce((sum, t) => sum + t.amount, 0);
                    return {
                        ...proj,
                        paid: projectDeposits,
                        remaining: Math.max(0, proj.cost - projectDeposits)
                    };
                });
            }, [projects, transactions]);

            const computedCashboxes = useMemo(() => {
                return cashboxes.map(box => {
                    const deposits = transactions.filter(t => t.type === "Deposit" && t.cashboxId === box.id).reduce((sum, t) => sum + t.amount, 0);
                    const withdrawals = transactions.filter(t => t.type === "Withdraw" && t.cashboxId === box.id).reduce((sum, t) => sum + t.amount, 0);
                    const transfersIn = transactions.filter(t => t.type === "Transfer" && t.toCashboxId === box.id).reduce((sum, t) => sum + t.amount, 0);
                    const transfersOut = transactions.filter(t => t.type === "Transfer" && t.cashboxId === box.id).reduce((sum, t) => sum + t.amount, 0);
                    return {
                        ...box,
                        currentBalance: box.baseBalance + deposits + transfersIn - withdrawals - transfersOut
                    };
                });
            }, [cashboxes, transactions]);

            const financials = useMemo(() => {
                const totalCollected = transactions.filter(t => t.type === "Deposit").reduce((sum, t) => sum + t.amount, 0);

                return {
                    totalCollected,
                    totalWithdrawn,
                    net: totalCollected - totalWithdrawn,
                    outstanding
                };

                                        <div className="flex justify-between py-1">

                                            <span className="font-bold font-sans text-primary">{financials.net.toLocaleString()} ج.م</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MODULE 7: SYSTEM SETTINGS & THEME CUSTOMIZER */}
                        {currentModule === "settings" && (
                            <div className="bg-bgCard rounded-2xl border border-borderColor p-4 shadow-sm space-y-5 animate__animated animate__fadeIn animate__faster">
                                <h3 className="text-xs font-bold text-textMain border-b border-borderColor pb-2">⚙️ {t("settings")}</h3>

                                <div className="space-y-4 text-xs">
                                    <div className="flex flex-col gap-1.5">
                                        <label className="font-bold text-textMain">{t("companyName")}</label>
                                        <input
                                            type="text"
                                            value={settings.companyName}
                                            onChange={(e) => setSettings({ ...settings, companyName: e.target.value })}
                                            className="border border-borderColor rounded-xl p-2.5 bg-bgMain text-textMain focus:outline-none"
                                        />
                                    </div>

                                    <div className="flex flex-col gap-1.5">
                                        <label className="font-bold text-textMain">{t("footerText")}</label>
                                        <input
                                            type="text"
                                            maxLength="100"
                                            value={settings.footerText}
                                            onChange={(e) => setSettings({ ...settings, footerText: e.target.value })}
                                            className="border border-borderColor rounded-xl p-2.5 bg-bgMain text-textMain focus:outline-none"
                                        />
                                    </div>

                                    <div className="flex flex-col gap-1.5">
                                        <label className="font-bold text-textMain">{t("themePreset")}</label>
                                        <select
                                            value={settings.themePreset}
                                            onChange={(e) => setSettings({ ...settings, themePreset: e.target.value })}
                                            className="border border-borderColor rounded-xl p-2.5 bg-bgMain text-textMain focus:outline-none font-bold"
                                        >
                                            <option value="oceanBlue">🔵 {t("oceanBlue")}</option>
                                            <option value="forestGreen">🟢 {t("forestGreen")}</option>
                                            <option value="sunsetOrange">🟠 {t("sunsetOrange")}</option>
                                            <option value="royalIndigo">🟣 {t("royalIndigo")}</option>
                                            <option value="crimsonRose">🔴 {t("crimsonRose")}</option>
                                            <option value="midnightGold">🟡 {t("midnightGold")}</option>
                                            <option value="customTheme">🎨 {t("customTheme")}</option>
                                        </select>
                                    </div>

                                    {settings.themePreset === "customTheme" && (
                                        <div className="flex flex-col gap-1.5 bg-bgMain/50 p-3 rounded-xl border border-borderColor animate__animated animate__fadeIn">
                                            <label className="font-bold text-textMain">{t("customColor")}</label>
                                            <div className="flex items-center gap-3">
                                                <input
                                                    type="color"
                                                    value={settings.customColor}
                                                    onChange={(e) => setSettings({ ...settings, customColor: e.target.value })}
                                                    className="w-12 h-10 border rounded-xl cursor-pointer"
                                                />
                                                <span className="font-mono text-textMain font-semibold">{settings.customColor}</span>
                                            </div>
                                        </div>
                                    )}

                                    <button 
                                        onClick={() => showToast(t("saveSuccess"))}
                                        className="w-full py-2.5 bg-primary text-white font-bold rounded-xl"
                                    >
                                        {t("save")}
                                    </button>
                                </div>
                            </div>
                        )}

                    </div>

                    {}
                    <div className="relative z-40">
                        {quickActionMenu && (
                            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40" onClick={() => setQuickActionMenu(false)}>
                                <div className="absolute bottom-24 left-1/2 -translate-x-1/2 flex flex-col items-center gap-3 w-4/5 animate__animated animate__bounceIn">
                                    <button 
                                        onClick={() => { setQuickActionMenu(false); setTransactionModal({ isOpen: true, data: null }); }}
                                        className="w-full py-3 bg-emerald-500 text-white rounded-2xl font-bold text-xs shadow-lg flex items-center justify-center gap-2"
                                    >
                                        <i className="fa-solid fa-receipt"></i>
                                        <span>إيداع / سحب مالي سريع</span>
                                    </button>
                                    <button 
                                        onClick={() => { setQuickActionMenu(false); setClientModal({ isOpen: true, data: null, isDetail: false }); }}
                                        className="w-full py-3 bg-primary text-white rounded-2xl font-bold text-xs shadow-lg flex items-center justify-center gap-2"
                                    >
                                        <i className="fa-solid fa-user-plus"></i>
                                        <span>إضافة عميل جديد</span>
                                    </button>
                                    <button 
                                        onClick={() => { setQuickActionMenu(false); setProjectModal({ isOpen: true, data: null }); }}
                                        className="w-full py-3 bg-amber-500 text-white rounded-2xl font-bold text-xs shadow-lg flex items-center justify-center gap-2"
                                    >
                                        <i className="fa-solid fa-folder-plus"></i>
                                        <span>إضافة مشروع جديد</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Centered Floating Action Button */}
                        <div className="absolute bottom-20 left-1/2 -translate-x-1/2 z-50">
                            <button 
                                onClick={() => setQuickActionMenu(!quickActionMenu)}
                                className="w-14 h-14 bg-primary text-white rounded-full flex items-center justify-center shadow-xl active:scale-90 transform hover:scale-105 transition-all outline-none ring-4 ring-white dark:ring-slate-900"
                            >
                                <i className={`fa-solid ${quickActionMenu ? "fa-xmark" : "fa-plus"} text-xl transition-all duration-200`}></i>
                            </button>
                        </div>
                    </div>

                    {}
                    <nav className="glass-nav border-t border-borderColor fixed bottom-0 left-0 right-0 z-35 flex justify-between px-3 pt-2 pb-safe shadow-lg text-center">
                        {[
                            { id: "dashboard", icon: "fa-chart-pie", label: t("dashboard") },
                            { id: "clients", icon: "fa-users", label: t("clients") },
                            { id: "spacer", spacer: true }, // Placeholder for middle FAB
                            { id: "projects", icon: "fa-briefcase", label: t("projects") },
                            { id: "transactions", icon: "fa-exchange-alt", label: t("transactions") }
                        ].map((item, index) => {
                            if (item.spacer) return <div key={index} className="w-14"></div>;
                            const isActive = currentModule === item.id;
                            return (
                                <button
                                    key={item.id}
                                    onClick={() => setCurrentModule(item.id)}
                                    className={`flex-1 flex flex-col items-center justify-center py-1 transition-all active:scale-95 ${
                                        isActive ? "text-primary font-bold scale-105" : "text-textMuted"
                                    }`}
                                >
                                    <i className={`fa-solid ${item.icon} text-lg mb-1`}></i>
                                    <span className="text-[9px] tracking-tight">{item.label}</span>
                                </button>
                            );
                        })}
                    </nav>

                    {}
                    {clientModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-end justify-center">
                            <div className="bg-bgCard w-full rounded-t-[2.5rem] border-t border-borderColor max-h-[90%] overflow-y-auto p-6 animate__animated animate__slideInUp animate__faster">
                                <div className="flex justify-between items-center border-b border-borderColor pb-3">
                                    <h3 className="font-extrabold text-sm text-textMain">
                                        {clientModal.isDetail ? t("clientDetail") : clientModal.data ? t("edit") : t("add")}
                                    </h3>
                                    <button onClick={() => setClientModal({ isOpen: false, data: null, isDetail: false })} className="text-textMuted text-lg">✕</button>
                                </div>

                                {clientModal.isDetail ? (
                                    <div className="py-4 space-y-4 text-xs text-textMain">
                                        <div className="p-3 bg-bgMain rounded-2xl space-y-2">
                                            <p className="font-bold text-sm text-primary">{clientModal.data.name}</p>
                                            <p>📱 {clientModal.data.mobile1}</p>
                                            {clientModal.data.email && <p>📧 {clientModal.data.email}</p>}
                                            {clientModal.data.address && <p>📍 {clientModal.data.address}</p>}
                                        </div>
                                        <div className="flex justify-end gap-2 pt-3">
                                            <button 
                                                onClick={() => setClientModal({ isOpen: false, data: null, isDetail: false })}
                                                className="w-full py-2.5 bg-primary text-white font-bold rounded-xl"
                                            >
                                                موافق
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        const fd = new FormData(e.target);
                                        const cData = {
                                            id: clientModal.data ? clientModal.data.id : Date.now(),
                                            name: fd.get("name"),
                                            mobile1: fd.get("mobile1"),
                                            email: fd.get("email"),
                                            address: fd.get("address"),
                                        };
                                        if (clientModal.data) handleUpdateClient(clientModal.data.id, cData);
                                        else handleAddClient(cData);
                                        setClientModal({ isOpen: false, data: null, isDetail: false });
                                    }} className="py-4 space-y-3 text-xs">
                                        <input type="text" name="name" placeholder={t("clientName")} defaultValue={clientModal.data?.name} className="w-full border border-borderColor bg-bgMain text-textMain p-3 rounded-xl focus:outline-none" required />
                                        <input type="text" name="mobile1" placeholder={t("mobile1")} defaultValue={clientModal.data?.mobile1} className="w-full border border-borderColor bg-bgMain text-textMain p-3 rounded-xl focus:outline-none" required />
                                        <input type="email" name="email" placeholder={t("email")} defaultValue={clientModal.data?.email} className="w-full border border-borderColor bg-bgMain text-textMain p-3 rounded-xl focus:outline-none" />
                                        <input type="text" name="address" placeholder={t("address")} defaultValue={clientModal.data?.address} className="w-full border border-borderColor bg-bgMain text-textMain p-3 rounded-xl focus:outline-none" />
                                        
                                        <div className="flex gap-2 pt-4">
                                            <button type="submit" className="flex-1 py-3 bg-primary text-white font-bold rounded-xl">{t("save")}</button>
                                            <button type="button" onClick={() => setClientModal({ isOpen: false, data: null })} className="flex-1 py-3 bg-bgMain text-textMuted font-bold rounded-xl">{t("cancel")}</button>
                                        </div>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}

                    {}
                    {projectModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-end justify-center">
                            <div className="bg-bgCard w-full rounded-t-[2.5rem] border-t border-borderColor max-h-[90%] overflow-y-auto p-6 animate__animated animate__slideInUp animate__faster">
                                <div className="flex justify-between items-center border-b border-borderColor pb-3">
                                    <h3 className="font-extrabold text-sm text-textMain">{projectModal.data ? t("edit") : t("add")}</h3>
                                    <button onClick={() => setProjectModal({ isOpen: false, data: null })} className="text-textMuted text-lg">✕</button>
                                </div>

                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    const pData = {
                                        id: projectModal.data ? projectModal.data.id : Date.now(),
                                        name: fd.get("name"),
                                        category: fd.get("category"),
                                        clientId: parseInt(fd.get("clientId")),
                                        status: fd.get("status"),
                                        cost: parseFloat(fd.get("cost")),
                                        details: fd.get("details"),
                                    };
                                    if (projectModal.data) handleUpdateProject(projectModal.data.id, pData);
                                    else handleAddProject(pData);
                                    setProjectModal({ isOpen: false, data: null });
                                }} className="py-4 space-y-3 text-xs">
                                    <input type="text" name="name" placeholder={t("projectName")} defaultValue={projectModal.data?.name} className="w-full border border-borderColor bg-bgMain p-3 rounded-xl text-textMain" required />
                                    <input type="text" name="category" placeholder={t("category")} defaultValue={projectModal.data?.category} className="w-full border border-borderColor bg-bgMain p-3 rounded-xl text-textMain" required />
                                    
                                    <select name="clientId" defaultValue={projectModal.data?.clientId} className="w-full border border-borderColor bg-bgMain p-3 rounded-xl text-textMain" required>
                                        <option value="">اختر العميل</option>
                                        {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>

                                    <select name="status" defaultValue={projectModal.data?.status || "In Progress"} className="w-full border border-borderColor bg-bgMain p-3 rounded-xl text-textMain">
                                        <option value="Completed">{t("statusCompleted")}</option>
                                        <option value="In Progress">{t("statusInProgress")}</option>
                                        <option value="Delayed">{t("statusDelayed")}</option>
                                        <option value="Cancelled">{t("statusCancelled")}</option>
                                    </select>

                                    <input type="number" name="cost" placeholder="التكلفة ج.م" defaultValue={projectModal.data?.cost} className="w-full border border-borderColor bg-bgMain p-3 rounded-xl text-textMain font-sans" required />
                                    <textarea name="details" placeholder="تفاصيل المشروع..." defaultValue={projectModal.data?.details} rows="3" className="w-full border border-borderColor bg-bgMain p-3 rounded-xl text-textMain"></textarea>

                                    <div className="flex gap-2 pt-4">
                                        <button type="submit" className="flex-1 py-3 bg-primary text-white font-bold rounded-xl">{t("save")}</button>
                                        <button type="button" onClick={() => setProjectModal({ isOpen: false, data: null })} className="flex-1 py-3 bg-bgMain text-textMuted font-bold rounded-xl">{t("cancel")}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {}
                    {cashboxModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-end justify-center">
                            <div className="bg-bgCard w-full rounded-t-[2.5rem] border-t border-borderColor p-6 animate__animated animate__slideInUp animate__faster">
                                <div className="flex justify-between items-center border-b border-borderColor pb-3">
                                    <h3 className="font-extrabold text-sm text-textMain">{t("add")}</h3>
                                    <button onClick={() => setCashboxModal({ isOpen: false, data: null })} className="text-textMuted text-lg">✕</button>
                                </div>

                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    const newBox = {
                                        id: Date.now(),
                                        paymentMethod: fd.get("paymentMethod"),
                                        baseBalance: parseFloat(fd.get("baseBalance") || 0),
                                        createdAt: new Date().toISOString().split("T")[0]
                                    };
                                    setCashboxes([...cashboxes, newBox]);
                                    setCashboxModal({ isOpen: false, data: null });
                                    showToast(t("saveSuccess"));
                                }} className="py-4 space-y-3 text-xs">
                                    <input type="text" name="paymentMethod" placeholder="اسم وسيلة الدفع (مثال: محفظة اتصالات كاش)" className="w-full border border-borderColor bg-bgMain p-3 rounded-xl text-textMain" required />
                                    <input type="number" name="baseBalance" placeholder="الرصيد الافتتاحي ج.م" className="w-full border border-borderColor bg-bgMain p-3 rounded-xl text-textMain font-sans" required />

                                    <div className="flex gap-2 pt-4">
                                        <button type="submit" className="flex-1 py-3 bg-primary text-white font-bold rounded-xl">{t("save")}</button>
                                        <button type="button" onClick={() => setCashboxModal({ isOpen: false, data: null })} className="flex-1 py-3 bg-bgMain text-textMuted font-bold rounded-xl">{t("cancel")}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {}
                    {transactionModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-end justify-center">
                            <div className="bg-bgCard w-full rounded-t-[2.5rem] border-t border-borderColor max-h-[90%] overflow-y-auto p-6 animate__animated animate__slideInUp animate__faster">
                                <div className="flex justify-between items-center border-b border-borderColor pb-3">
                                    <h3 className="font-extrabold text-sm text-textMain">{t("add")}</h3>
                                    <button onClick={() => setTransactionModal({ isOpen: false, data: null })} className="text-textMuted text-lg">✕</button>
                                </div>

                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    const newTx = {
                                        id: Date.now(),
                                        type: fd.get("type"),
                                        amount: parseFloat(fd.get("amount")),
                                        cashboxId: parseInt(fd.get("cashboxId")),
                                        notes: fd.get("notes"),
                                        clientId: fd.get("clientId") ? parseInt(fd.get("clientId")) : null,
                                        projectId: fd.get("projectId") ? parseInt(fd.get("projectId")) : null,
                                        toCashboxId: fd.get("toCashboxId") ? parseInt(fd.get("toCashboxId")) : null,
                                        createdAt: new Date().toISOString().split("T")[0]
                                    };
                                    handleAddTransaction(newTx);
                                    setTransactionModal({ isOpen: false, data: null });
                                }} className="py-4 space-y-3 text-xs">
                                    
                                    <select name="type" defaultValue={transactionModal.data?.type || "Deposit"} className="w-full border border-borderColor bg-bgMain p-3 rounded-xl text-textMain font-bold">
                                        <option value="Deposit">{t("deposit")}</option>
                                        <option value="Withdraw">{t("withdraw")}</option>
                                        <option value="Transfer">{t("transfer")}</option>
                                    </select>

                                    <input type="number" name="amount" placeholder="المبلغ ج.م" defaultValue={transactionModal.data?.amount} className="w-full border border-borderColor bg-bgMain p-3 rounded-xl text-textMain font-sans" required />
                                    
                                    <select name="cashboxId" className="w-full border border-borderColor bg-bgMain p-3 rounded-xl text-textMain" required>
                                        <option value="">اختر حساب الصندوق</option>
                                        {cashboxes.map(b => <option key={b.id} value={b.id}>{b.paymentMethod}</option>)}
                                    </select>

                                    <select name="clientId" className="w-full border border-borderColor bg-bgMain p-3 rounded-xl text-textMain">
                                        <option value="">العميل المرتبط (اختياري)</option>
                                        {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>

                                    <select name="projectId" className="w-full border border-borderColor bg-bgMain p-3 rounded-xl text-textMain">
                                        <option value="">المشروع المرتبط (اختياري)</option>
                                        {projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                    </select>

                                    <input type="text" name="notes" placeholder="ملاحظات وتفاصيل الحركة..." className="w-full border border-borderColor bg-bgMain p-3 rounded-xl text-textMain" required />

                                    <div className="flex gap-2 pt-4">
                                        <button type="submit" className="flex-1 py-3 bg-primary text-white font-bold rounded-xl">{t("save")}</button>
                                        <button type="button" onClick={() => setTransactionModal({ isOpen: false, data: null })} className="flex-1 py-3 bg-bgMain text-textMuted font-bold rounded-xl">{t("cancel")}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
